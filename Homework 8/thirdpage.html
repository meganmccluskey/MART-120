<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        h1 {
            font-size: 40px;
            text-align: center;
        }

        h2 {
            text-decoration: underline;
        }

        p {
            color: darkred;
        }

        body {
            margin: 20px;
        }

        nav {
            margin-bottom: 25px;
        }

        nav a {
            margin-right: 15px;
        }

        .invalid-field {
            border: 2px solid red !important;
        }

        #terms.invalid-field {
            outline: 2px solid red;
            outline-offset: 3px;
        }

        #formMessage {
            color: darkred;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="homepage.html">Home</a>
        <a href="secondpage.html">My Favorite Story</a>
        <a href="thirdpage.html">Contact Us</a>
         <a href="game.html">Math Game</a>
    </nav>

    <!-- Page heading -->
    <h1 style="color: darkblue;">Contact Us</h1>

    <h2>Contact Information</h2>

    <p>Please fill out the form below to contact us.</p>

    <form id="contactForm" novalidate>

        <div class="mb-3">
            <label for="name" class="form-label">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <input
                type="checkbox"
                id="terms"
                name="terms"
                required>

            <label for="terms">
                I agree to the terms and conditions.
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Submit
        </button>

        <p id="formMessage" role="alert"></p>

    </form>

    <script>
        var contactForm = document.getElementById("contactForm");

        var nameField = document.getElementById("name");
        var emailField = document.getElementById("email");
        var termsField = document.getElementById("terms");
        var formMessage = document.getElementById("formMessage");

        contactForm.addEventListener("submit", function(event) 
       
        {
            event.preventDefault();

            // Clear previous red borders
            nameField.classList.remove("invalid-field");
            emailField.classList.remove("invalid-field");
            termsField.classList.remove("invalid-field");

            formMessage.textContent = "";

            if (nameField.value.trim() === "") {
                nameField.classList.add("invalid-field");
                formMessage.textContent = "Please enter your name.";
                nameField.focus();
                return;
            }

            // Check the email
            if (emailField.value.trim() === "" ||
                !emailField.checkValidity()) 
                
            {

                emailField.classList.add("invalid-field");
                formMessage.textContent =
                    "Please enter a valid email address.";

                emailField.focus();
                return;
            }

            if (!termsField.checked) {
                termsField.classList.add("invalid-field");
                formMessage.textContent =
                    "Please agree to the terms and conditions.";

                termsField.focus();
                return;
            }

            formMessage.textContent =
                "Thank you! All fields are valid!";
        });

        nameField.addEventListener("input", function() {
            nameField.classList.remove("invalid-field");
            formMessage.textContent = "";
        });

        emailField.addEventListener("input", function() {
            emailField.classList.remove("invalid-field");
            formMessage.textContent = "";
        });

        termsField.addEventListener("change", function() {
            termsField.classList.remove("invalid-field");
            formMessage.textContent = "";
        });
    </script>

</body>
</html>
